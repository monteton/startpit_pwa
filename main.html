<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#E2EEC6" />

    <title>Питание + тренировки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <style>
        :root {
            /* Салатовый фон (по образцу листа), белые выпуклые кнопки */
            --bg: #E2EEC6;
            --sh-dark: #BCCF94;
            --sh-light: #F7FCE8;
            --card: #FFFFFF;
            --card-sh: #D6DEC2;

            /* Салатовая зелень (по образцу листа) */
            --swamp-900: #34400c;
            --swamp-700: #5a6c08;
            --swamp-500: #96a722;
            --ink-soft: #66762c;

            /* Акцент: мягкий фиолетовый */
            --accent: #8C74C6;
            --accent-deep: #6A54A3;

            /* Свежая зелень листвы (по образцу) — иконка приветствия */
            --leaf: #6AA201;
            --leaf-deep: #3F7C0D;
            --cream: #FFF8EE;

            --raised: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
            --raised-sm: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
            --pressed: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
            /* Тени внутри белой кнопки */
            --card-pressed: inset 4px 4px 8px var(--card-sh), inset -4px -4px 8px #fff;
            --card-raised: 4px 4px 8px var(--card-sh), -4px -4px 8px #fff;

            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            background: #D6E4B6;
            color: var(--swamp-900);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-frame {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .12);
            /* Экран без прокрутки: картинка внизу забирает оставшееся место */
            display: flex;
            flex-direction: column;
        }

        header {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: calc(16px + env(safe-area-inset-top)) 16px 8px;
            min-height: 64px;
        }

        .back-button {
            position: absolute;
            left: 16px;
            bottom: 4px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 20px;
            color: var(--swamp-700);
            text-decoration: none;
            background: var(--card);
            box-shadow: var(--raised-sm);
            transition: box-shadow .3s var(--ease);
        }

        .back-button:active { box-shadow: var(--card-pressed); }

        h1 {
            font-size: 24px;
            line-height: 32px;
            font-weight: 600;
            letter-spacing: -.02em;
            margin: 0;
            color: var(--swamp-900);
        }

        /* Длинное название не должно упираться в кнопку «Назад» */
        header h1 { padding: 0 44px; text-align: center; }
        @media (max-width: 400px) { header h1 { font-size: 21px; } }

        main {
            padding: 16px 16px calc(96px + env(safe-area-inset-bottom));
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* ---------- Кнопки ---------- */
        .tile {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            min-height: 120px;
            padding: 16px;
            border-radius: 24px;
            background: var(--card);
            box-shadow: var(--raised);
            color: var(--swamp-900);
            text-decoration: none;
            user-select: none;
            transition: box-shadow .3s var(--ease), transform .5s var(--ease);
        }

        .tile:active {
            box-shadow: var(--card-pressed);
            transform: scale(.98);
        }

        .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

        .tile-label {
            font-size: 16px;
            line-height: 24px;
            font-weight: 600;
            letter-spacing: -.01em;
            text-wrap: balance;
        }

        /* Лунка с иконкой: вдавлена в кнопку */
        .well {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 28px;
            color: var(--swamp-700);
            box-shadow: var(--card-pressed);
        }

        /* Двухцветные иконки: заливка фиолетовая, контур болотный */
        .well .ph-duotone::before { color: var(--accent); opacity: .9; }

        /* ---------- Широкая кнопка приветствия ---------- */
        .tile-wide {
            grid-column: 1 / -1;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            min-height: 96px;
        }

        .tile-wide .badge {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 28px;
            color: var(--cream);
            background: var(--leaf);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .35),
                inset 0 -2px 0 var(--leaf-deep),
                4px 4px 8px var(--card-sh),
                -4px -4px 8px #fff;
        }

        .tile-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
        .tile-wide .tile-label { font-size: 18px; line-height: 28px; }
        .tile-sub { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink-soft); }

        .tile-arrow {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 9999px;
            display: grid;
            place-items: center;
            font-size: 18px;
            color: var(--accent);
            box-shadow: var(--card-raised);
        }

        /* ---------- Картинка в вылепленной рамке ---------- */
        .food-frame {
            margin: 16px 0 0;
            flex: 1 1 0;
            min-height: 120px;
            position: relative;
            padding: 8px;
            border-radius: 24px;
            background: var(--card);
            box-shadow: var(--raised);
        }

        .food-image {
            position: absolute;
            inset: 8px;
            width: calc(100% - 16px);
            height: calc(100% - 16px);
            object-fit: cover;
            object-position: 50% 45%;
            display: block;
            border-radius: 16px;
        }

        /* ---------- Нижнее меню ---------- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: space-around;
            background: var(--card);
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -8px 16px -4px var(--sh-dark), 0 -1px 0 var(--sh-light);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--swamp-700);
            text-decoration: none;
            font-size: 12px;
            line-height: 16px;
            font-weight: 600;
            user-select: none;
        }

        .nav-item .nav-ic {
            width: 40px;
            height: 32px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 22px;
            color: var(--accent);
            box-shadow: var(--card-pressed);
        }

        /* ---------- Компактный экран без прокрутки ----------
           Плитки ниже, картинка внизу занимает остаток высоты и обрезается по краям */
        main { padding-top: 12px; }
        .menu-grid { gap: 12px; }
        .tile { min-height: 96px; padding: 12px 14px; gap: 8px; border-radius: 20px; }
        .well { width: 40px; height: 40px; font-size: 24px; }
        .tile-wide { min-height: 80px; }
        .tile-wide .badge { width: 48px; height: 48px; font-size: 24px; }
        .food-frame { margin-top: 12px; min-height: 0; }
        /* На совсем низких экранах картинке не хватает места — прячем её */
        @media (max-height: 779px) { .food-frame { display: none; } }

        @media (prefers-reduced-motion: reduce) {
            .tile { transition: box-shadow .3s linear; }
            .tile:active { transform: none; }
        }
    </style>
    <script src="access-control.js"></script>
    <link rel="stylesheet" href="assets/nav.css">
</head>

<body>
